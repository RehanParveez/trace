blocked:
  member_volume: "needs members the reader does not emit: combined footings, raft, piles, sunken and cantilever slabs, shear walls, ramps, tanks, stands; the reader has no class for them"
  member_contact: "needs the contact faces of columns and beams left without plaster; no reader marks which are exposed"
  excavation: "needs pit and trench sizes from sections; the reader gives footing sizes but no working space or depth to a founding level"
  layers: "needs a note fact for the build-up (membrane, insulation, tile) and the area it covers; only roof-treatment area is read, so the roof layers are built and the foundation, basement and tank layers are not"
  pipe_run: "needs pipe and conduit runs from the plumbing and electrical plans; the reader gives rain pipes only"
  counts: "needs symbol counts per legend entry; the reader counts lights, fans, switches, sockets, boards and tank covers only"
  site: "needs the site plan areas (lawn, drive, steps, drains); the reader gives porch and paving finishes only"
  wall_face: "needs the face area of each wall type; the reader gives inside and outside plaster areas and the volume of brick walls only"
  wall_run: "needs wall and building outline lengths by floor; the reader has no running length for edges, joints or rails"
  floor_area: "needs the room area by finish; the reader gives the floor finish and ceiling areas, so the items that are a floor or ceiling alternative are built"
  openings_area: "needs door and window sizes from the schedule; the reader gives door shutter and window areas"
