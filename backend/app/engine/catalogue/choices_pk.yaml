use_defaults_question:
  id: USE_QS_DEFAULTS
  asks: Use the QS defaults for every choice the drawing does not print and nobody has answered?
  options: {'no': Ask me each one, 'yes': Use my QS defaults and show every line that took one as ASSUMED}
  default: 'no'
