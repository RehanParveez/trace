- id: PK_STOREY_DEFAULT
  module: takeoff/model/storeys.py
  kind: CONVENTION
  default: off
  status: CANDIDATE
  evidence: []
  notes: A QS floor-to-floor height used only for a floor with no printed, joined or decided height, when a project passes a value. No value is switched on anywhere. CT-3 moves it into the conventions file with a source and a range.
