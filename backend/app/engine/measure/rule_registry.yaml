- id: HOLD_SUPERSTRUCTURE_ON_SUBSTRUCTURE_LAYOUTS
  module: takeoff/extract/read_status.py
  kind: READING
  default: off
  status: CANDIDATE
  evidence:
    - {office: A, sets: 1, metric: "census: members set aside on an excavation or footing layout", value: 202, pack: GEN-1, met: false}
    - {office: B, sets: 6, metric: "census: members set aside on an excavation or footing layout", value: 0, pack: GEN-1, met: false}
    - {office: C, sets: 1, metric: "census: members set aside on an excavation or footing layout", value: 0, pack: GEN-1, met: false}
    - {office: D, sets: 1, metric: "census: members set aside on an excavation or footing layout", value: 0, pack: GEN-1, met: false}
    - {office: E, sets: 1, metric: "census: members set aside on an excavation or footing layout", value: 0, pack: GEN-1, met: false}
  notes: A sheet whose page title or only view caption says excavation or footing layout cannot hold walls, rooms, doors, windows, lintels, stairs, finish layers or beams. The rule sets those classes aside (held, visible, never deleted) and treats an excavation layout as a held plan kind.
