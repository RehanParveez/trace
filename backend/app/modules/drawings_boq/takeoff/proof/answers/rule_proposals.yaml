how_to: 'Each entry is a pattern that at least two sources showed in corrections people made. origin CHECKED means every line behind it was made by a person; DRAFT means some were made from draft truth for a dry run, and such an entry is never applied. replay says what the benchmark can tell: REMAP_SAFE or REMAP_UNSAFE for a register confusion, FITS or DOES_NOT_FIT for a vocabulary pair, NOT_REPLAYABLE for the rest. To take a proposal write confirmed: true, then run: python -m app.modules.drawings_boq.takeoff.proof.bench.miner apply --by <your name>. A vocabulary pair goes to the vocabulary review, where it is confirmed again; the other kinds are listed for you to change by hand.'
