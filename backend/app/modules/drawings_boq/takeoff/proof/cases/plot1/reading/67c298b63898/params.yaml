- element:
    sheet: 1
    class: BOUNDARY_WALL
    key: p1-W1
  qs_line:
  - WALL_PLASTER/GROUND
  inputs:
    length_in:
      state: DERIVED
      from: vector outline of page 1
    thickness_in:
      state: DERIVED
      value: 4.5
      from: drawn gap; the QS note calls these the 4.5 in back and front walls
    height_in:
      state: MISSING
      note: no boundary wall height is printed on the plans; p5 prints a boundary wall elevation not read in this pack
    plaster_faces:
      state: DEFAULTED
      from: 'rules_plot1.yaml: finish.boundary_walls'
- element:
    sheet: 1
