  inputs:
    length_in:
      state: DERIVED
      from: measured on the vector outline of page 1; the plan prints only some overall dimensions
    thickness_in:
      state: DERIVED
      value: 9
      from: gap between the drawn outline lines, snapped to 9 or 4.5 in; printed as 4½ on one wall only
    height_in:
      state: DERIVED
