origin: QS_WORKBOOK
rules:
  - key: finish.floor_item
    scope: {room_type: PORCH}
    value: FIN-PORCH-TILE
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: "Pourch Mate Tile (16x16)" is a line of its own, apart from the "G.F Floor Tile Work (24x48)"'
  - key: finish.floor_item
    scope: {room_type: PASSAGE}
    value: FIN-PAVING
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: "Tuff Tile (8x4) Passage Area" is a line of its own'
  - key: finish.dado_height_mm
    scope: {room_type: BATH}
    value: CEILING
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: the line is "Bath Room Wall Tile", not a dado, and the bill has no other bath wall item; taken to the ceiling'
  - key: finish.dado_height_mm
    scope: {room_type: WC}
    value: CEILING
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: a W.C is tiled as the bath is ("Bath Room Wall Tile")'
  - key: finish.dado_height_mm
    scope: {room_type: PWD}
    value: CEILING
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: a powder room is tiled as the bath is ("Bath Room Wall Tile")'
  - key: finish.ceiling_includes
    scope: {}
    value: [BEDROOM, BATH, PWD, WC, KITCHEN, LOUNGE, DINING, DRAWING, PORCH, TERRACE, PASSAGE, LAWN, STAIR, STORE, SERVANT, OTHER]
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: "False Ceiling" is one line for the building, so porch, terrace and passage rooms are in it. The same list as the seed; it moves nothing on 191-C, where the reader finds no terrace or passage room'
  - key: finish.facade_item
    scope: {elevation: FRONT}
    value: FIN-FACADE-TILE
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: the bill has one line, "Tile Work of Front side (front elevation)". The zones of the front elevation that are drawn with a pattern of joints are taken as that tile. Their area is estimated from the rectangle round each pattern, so it includes whatever lies inside it and leaves out tile that is not drawn as joints; it may be rough'
  - key: finish.sill_item
    scope: {}
    value: FIN-SILL-MARBLE
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: the bill has one line, "Windows Sill Marble", 163.9 sft. Every window with a printed sill of 300 mm or more is taken to have a marble sill as wide as the window and as deep as the seed depth (230 mm, a 9-inch wall); the typical sill detail prints "WALL THICKNESS" and no figure'
  - key: finish.stopper_item
    scope: {}
    value: FIN-WATER-STOPPER
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: the bill has one line, "Water Stoper", 65.4 rft. The doors on the outline of the finished baths and toilets are taken as the places it is laid; the bill does not say which doors'
  - key: finish.pcc_under
    scope: {}
    value: [BEDROOM, BATH, PWD, WC, KITCHEN, LOUNGE, DINING, DRAWING, PORCH, TERRACE, PASSAGE, LAWN, STAIR, STORE, SERVANT, OTHER]
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: "P.C.C Concrete (1:2:4) under Floor" is one line for the building, so the bed is under porch and passage rooms too. The same list as the seed; it moves nothing on 191-C'