    note: 'read from the QS totals, not stated by him: "False Ceiling" is one line for the building, so porch, terrace and passage rooms are in it. The same list as the seed; it moves nothing on 191-C, where the reader finds no terrace or passage room'
  - key: finish.pcc_under
    scope: {}
    value: [BEDROOM, BATH, PWD, WC, KITCHEN, LOUNGE, DINING, DRAWING, PORCH, TERRACE, PASSAGE, LAWN, STAIR, STORE, SERVANT, OTHER]
    cls: JUDGEMENT
    note: 'read from the QS totals, not stated by him: "P.C.C Concrete (1:2:4) under Floor" is one line for the building, so the bed is under porch and passage rooms too. The same list as the seed; it moves nothing on 191-C'