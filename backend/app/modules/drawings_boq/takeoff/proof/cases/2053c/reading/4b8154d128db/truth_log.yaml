- date: '2026-11-04'
  by: claude_eye
  pack: RB-C3
  note: 'Convention for BEAM_SECTION rows: one row for the section at mid span and one for the section at the support, anchored on the centre of the printed width dimension (the caption BEAM Bn is vector, not in the text layer). The left stacked dimensions give form: UPSTAND is beam above the slab (dims read [above slab, slab]), DROPPED is beam below the slab ([slab, below slab]), FREE is a full-depth beam with no slab dimension. Total depth is DERIVED in params.yaml, never written as printed. A support label such as 2#4+2#6EXT is split into top_bars (2#4) and ext_top_bars (2#6 EXT) with the printed label kept in printed_support_top.'
- date: '2026-11-04'
