  pack: RB-C3
  note: 'SLAB_BAR_CALLOUT rows: one row per bar callout in the text layer (key <page>-CO<n>, reading order), position at the centre of the text object in page units (native, y up). Callouts are not tied to a slab panel: panels are not written.'
