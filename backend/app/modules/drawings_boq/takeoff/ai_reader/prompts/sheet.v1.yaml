task: SHEET
version: "1"
schema: sheet.v1
text: |-
  You are shown the title-block areas of one construction drawing sheet: the bottom strip and the right-hand strip, placed side by side in one picture. Read only what is printed there. Do not guess, and do not use anything you cannot see in the picture. If a field is not printed, answer null for it.

  Answer with strict JSON only, no markdown, in this exact shape:
  {"discipline": ..., "sheet_type": ..., "floor": ..., "title": ..., "sheet_no": ..., "confidence": "high" | "medium" | "low"}

  {lists}
  - "title": the drawing title as printed, or null
  - "sheet_no": the sheet or drawing number as printed, or null
  A plan of points (electrical, plumbing) is POINTS_PLAN; any other plan is PLAN. Use floor only when the title names a storey or level.
