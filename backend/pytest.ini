[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
  ignore::DeprecationWarning
  ignore::PendingDeprecationWarning
addopts =
  -ra
  --strict-markers
  --tb=short
markers =
  unit: pure unit tests (no DB / Redis)
  integration: tests that hit DB or Redis
  auth: authentication / token flows
  permissions: permission / role checks
  slow: slower integration paths