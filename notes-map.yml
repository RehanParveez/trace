mappings:
  - pattern: "backend/app/modules/identity/**/*.py"
    notes_file: "notes/identity.md"
    section: "identity"
    review: true
  - pattern: "backend/app/modules/site_progress/**/*.py"
    notes_file: "notes/site_progress.md"
    section: "site-progress"
  - pattern: "backend/app/modules/labour/**/*.py"
    notes_file: "notes/labour.md"
    section: "labour"
  - pattern: "backend/app/modules/material_stock/**/*.py"
    notes_file: "notes/material_stock.md"
    section: "material-stock"
  - pattern: "backend/app/modules/procurement/**/*.py"
    notes_file: "notes/procurement.md"
    section: "procurement"
  - pattern: "backend/app/modules/projects/**/*.py"
    notes_file: "notes/projects.md"
    section: "projects"
  - pattern: "backend/app/modules/**/*.py"
    notes_file: "notes/modules.md"
    section: "modules-general"

ignore:
  - "notes/**"
  - ".git/**"
  - ".notes/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/migrations/**"
  - "**/.venv/**"
  - "**/venv/**"